apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vis-ingress
  namespace: vis-production
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - api.vis.enterprise.com
      secretName: vis-tls-secret
  rules:
    - host: api.vis.enterprise.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vis-api-gateway-service
                port:
                  number: 80
