version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vis-prod-postgres
    restart: always
    environment:
      POSTGRES_DB: vis_db
      POSTGRES_USER: vis_user
      POSTGRES_PASSWORD: vis_secure_prod_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vis_user -d vis_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:7.0
    container_name: vis-prod-mongo
    restart: always
    environment:
      MONGO_INITDB_DATABASE: vis_telemetry_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vis-prod-redis
    restart: always
    command: redis-server --requirepass vis_redis_secure_password_2026
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "vis_redis_secure_password_2026", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: bitnami/kafka:3.7-debian-12
    container_name: vis-prod-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
    volumes:
      - kafka_prod_data:/bitnami/kafka

  emqx:
    image: emqx/emqx:5.5
    container_name: vis-prod-emqx
    restart: always
    ports:
      - "1883:1883"
      - "18083:18083"
    environment:
      - EMQX_DASHBOARD__DEFAULT_USER__PASSWORD=vis_emqx_secure_password_2026
    volumes:
      - emqx_prod_data:/opt/emqx/data

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vis-prod-api-gateway
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://vis_user:vis_secure_prod_password_2026@postgres:5432/vis_db?schema=public
      - MONGODB_URI=mongodb://mongo:27017/vis_telemetry_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=vis_redis_secure_password_2026
      - KAFKA_BROKERS=kafka:9092
      - MQTT_URL=mqtt://emqx:1883
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_prod_data:
  mongo_prod_data:
  redis_prod_data:
  kafka_prod_data:
  emqx_prod_data:
