global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert.rules.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "vis-api-gateway"
    metrics_path: "/api/v1/health"
    static_configs:
      - targets: ["api-gateway:3000"]

  - job_name: "vis-telemetry-service"
    metrics_path: "/api/v1/health"
    static_configs:
      - targets: ["telemetry-service:3005"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
