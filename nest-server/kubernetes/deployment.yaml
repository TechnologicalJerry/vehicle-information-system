apiVersion: apps/v1
kind: Deployment
metadata:
  name: vis-api-gateway
  labels:
    app: vis-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vis-api-gateway
  template:
    metadata:
      labels:
        app: vis-api-gateway
    spec:
      containers:
        - name: api-gateway
          image: vis-api-gateway:latest
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: vis-configmap
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
