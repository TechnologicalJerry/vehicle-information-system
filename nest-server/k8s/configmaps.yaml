apiVersion: v1
kind: ConfigMap
metadata:
  name: vis-config
  namespace: vis-production
data:
  NODE_ENV: "production"
  PORT: "3000"
  GLOBAL_PREFIX: "api"
  API_VERSION: "v1"
  LOG_LEVEL: "info"
  REDIS_HOST: "redis-service"
  REDIS_PORT: "6379"
  KAFKA_BROKERS: "kafka-service:9092"
  MQTT_URL: "mqtt://emqx-service:1883"
