apiVersion: apps/v1
kind: Deployment
metadata:
  name: vis-api-gateway
  namespace: vis-production
  labels:
    app: vis-api-gateway
spec:
  replicas: 3
  selector:
    matchLabels:
      app: vis-api-gateway
  template:
    metadata:
      labels:
        app: vis-api-gateway
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - vis-api-gateway
                topologyKey: "kubernetes.io/hostname"
      containers:
        - name: api-gateway
          image: vis/backend:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: vis-config
            - secretRef:
                name: vis-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1000m
              memory: 1024Mi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
