replicaCount: 3

image:
  repository: vis/backend
  pullPolicy: IfNotPresent
  tag: "1.0.0"

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  hosts:
    - host: api.vis.enterprise.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: vis-tls-secret
      hosts:
        - api.vis.enterprise.com

resources:
  limits:
    cpu: 1000m
    memory: 1024Mi
  requests:
    cpu: 250m
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
